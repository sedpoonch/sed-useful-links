<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Useful Links</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #F4F6F8;
      margin: 0;
      padding: 20px;
    }

    h2 {
      text-align: center;
      color: #005B9F;
      margin-bottom: 24px;
      font-size: 24px;
    }

    .grid-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 16px;
      max-width: 600px;
      margin: auto;
    }

    .card {
      position: relative;
      display: block;
      text-decoration: none;
      border-radius: 16px;
      padding: 16px;
      min-height: 140px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
      transition: transform 0.2s, box-shadow 0.2s;
      overflow: hidden;
    }

    .card:hover, .card:active {
      transform: translateY(-4px);
      box-shadow: 0 10px 15px rgba(0,0,0,0.1);
    }

    .card-title {
      font-size: 18px;
      font-weight: bold;
      color: #333333;
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 2;
    }

    .card-icon {
      position: absolute;
      bottom: 16px;
      right: 16px;
      font-size: 55px;
      color: #333333;
      opacity: 0.9;
    }

    /* Custom Colors matching your reference image */
    .bg-cream { background-color: #FFEFC8; }
    .bg-yellow { background-color: #FFD54F; }
    .bg-lightblue { background-color: #E1F5FE; }
    .bg-lightyellow { background-color: #FFF59D; }
    
    /* Blue card needs white text/icon for contrast */
    .bg-blue { 
        background-color: #29B6F6; 
    }
    .bg-blue .card-title, .bg-blue .card-icon {
        color: #FFFFFF;
    }
    
  </style>
</head>
<body>

  <h2>Useful Links</h2>

  <div class="grid-container">

    <a href="https://ndl.iitkgp.ac.in/ndl_se" class="card bg-cream" target="_blank">
      <div class="card-title">NDL Library</div>
      <i class="fas fa-book-reader card-icon" style="color: #005B9F;"></i>
    </a>
    
    <a href="https://www.google.com" class="card bg-yellow" target="_blank">
      <div class="card-title">Google</div>
      <i class="fab fa-google card-icon"></i>
    </a>

    <a href="https://www.wikipedia.org" class="card bg-blue" target="_blank">
      <div class="card-title">Wikipedia</div>
      <i class="fab fa-wikipedia-w card-icon"></i>
    </a>

    <a href="https://schedujammu.nic.in" class="card bg-lightblue" target="_blank">
      <div class="card-title">DSE Jammu</div>
      <i class="fas fa-user-tie card-icon" style="color: #005B9F;"></i>
    </a>

    <a href="https://jkbose.jk.gov.in/" class="card bg-yellow" target="_blank">
      <div class="card-title">JKBOSE</div>
      <i class="fas fa-desktop card-icon" style="color: #333;"></i>
    </a>

    <a href="https://chat.openai.com" class="card bg-lightyellow" target="_blank">
      <div class="card-title">ChatGPT</div>
      <i class="fas fa-robot card-icon" style="color: #10A37F;"></i>
    </a>

  </div>

</body>
</html>
